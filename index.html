<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="./style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <main class="background-wrapper">

    <div class="big-wrapper">

      <div class="image-container">
        <img src="./assets/images/illustration-article.svg" 
        alt="yellow and black illustration"></img>
      </div>
      
      <div class="action-btn-and-date">
        <a href="#HtmlAndCssFoundations">Learning</a>
        <p>Published 21 Dec 2023</p>

        </p>
      </div>

      <div class="avatar-and-name">
        <img src="./assets/images/image-avatar.webp" 
        alt="avatar image"></img>
        <h4> Greg Hooper</h4>

  <footer class="attribution">
